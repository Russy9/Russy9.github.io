<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>body{
    font-family:Arial, sans-serif;
    background:#eef4ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    width:300px;
}

h2{
    text-align:center;
    color:#0066cc;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#004c99;
}

p{
    text-align:center;
}
</style>
</head>
<body>

<div class="login-box">

    <h2>Login</h2>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="message"></p>

</div>

<script>
function login(){

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if(username === "admin" && password === "1234"){
        document.getElementById("message").innerHTML =
        "✅️Login Successful!";
        
        // Redirect to home page
        setTimeout(function(){
            window.location.href = "index.html";
        },1000);

    }else{
        document.getElementById("message").innerHTML =
        "❌️Incorrect username or password.";
    }
}
</script>
 
</body>
</html>
